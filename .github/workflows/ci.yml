name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run format:check:web
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nuzenio
          POSTGRES_USER: nuzenio
          POSTGRES_PASSWORD: nuzenio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuzenio -d nuzenio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NUZENIO_ENVIRONMENT: test
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio
      NUZENIO_TEST_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_test
      NUZENIO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pip freeze --all --exclude-editable | pip-audit --strict --no-deps --disable-pip -r /dev/stdin
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: alembic -c apps/api/alembic.ini check
      - run: python -m nuzenio_api.seed
        working-directory: apps/api
      - run: python -m nuzenio_api.seed
        working-directory: apps/api
      - run: pytest apps/api/tests

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nuzenio
          POSTGRES_USER: nuzenio
          POSTGRES_PASSWORD: nuzenio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuzenio -d nuzenio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NUZENIO_ENVIRONMENT: test
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_e2e
      NUZENIO_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/pip install -e "apps/api[dev]"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:setup
      - name: Run production Playwright suite without retries
        run: npm --workspace apps/web run test:e2e:release
      - name: Prepare separate offline draft fixtures
        env:
          NUZENIO_E2E_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_draft_e2e
          NUZENIO_DRAFT_INBOX_ENABLED: "true"
          NUZENIO_FEED_KILL_SWITCH: "true"
        run: apps/api/.venv/bin/python -m nuzenio_api.e2e_setup
      - name: Run offline draft browser gate without retries
        env:
          NUZENIO_E2E_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_draft_e2e
        run: npm --workspace apps/web run test:e2e:drafts
      - name: Verify offline source-card development preview without retries
        run: npm --workspace apps/web run test:e2e:source-cards
      - name: Verify source-card preview is absent in production
        env:
          NUZENIO_SOURCE_CARD_TEST_PRODUCTION: "true"
        run: npm --workspace apps/web run test:e2e:source-cards

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: nuzenio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: nuzenio_ci
      POSTGRES_USER: nuzenio_ci
      POSTGRES_PORT: 15432
      REDIS_PORT: 16379
      API_PORT: 18000
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI-only database credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in POSTGRES_PASSWORD NUZENIO_RUNTIME_PASSWORD NUZENIO_AUDIT_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$variable" "$value" >> "$GITHUB_ENV"
          done
      - name: Validate Compose configuration
        run: docker compose --profile ci config --quiet
      - name: Build isolated service images
        run: docker compose --profile ci build api worker migrate seed restore-verify postgres-ops-test
      - name: Start isolated application stack and wait for health
        run: docker compose up --detach --wait --wait-timeout 180 api worker
      - name: Load explicit fictional fixtures
        run: docker compose --profile demo run --rm seed
      - name: Verify service and API health
        run: |
          set -euo pipefail
          for service in postgres redis api worker; do
            container_id="$(docker compose ps --quiet "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          done
          migration_id="$(docker compose ps --all --quiet migrate)"
          test -n "$migration_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")" = 0
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready \
            | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body["status"] == "ok"'
          docker compose exec --no-TTY worker python -c \
            "import json,urllib.request; body=json.load(urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)); assert body['ready'] is True"
          docker compose exec --no-TTY api python -c \
            "from nuzenio_api.config import get_settings; assert get_settings().feed_kill_switch is True"
          test "$(docker compose exec --no-TTY postgres psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT count(*) FROM source_feeds WHERE url !~ '^https://[^/]+[.]example(/|$)'")" = 0
      - name: Verify PostgreSQL backup restoration
        run: |
          docker compose --profile ci up --detach --wait --wait-timeout 120 postgres-restore
          docker compose --profile ci run --rm restore-verify
          docker compose --profile ci run --rm postgres-ops-test
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose --profile ci ps --all
          docker compose --profile ci logs --no-color --tail=200 api worker migrate postgres redis postgres-restore
      - name: Tear down isolated stack and temporary volumes
        if: always()
        run: |
          set -euo pipefail
          docker compose --profile ci down --volumes --remove-orphans --timeout 10
          test -z "$(docker ps --all --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          test -z "$(docker network ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
