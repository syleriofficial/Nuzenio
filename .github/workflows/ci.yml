name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run format:check:web
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nuzenio
          POSTGRES_USER: nuzenio
          POSTGRES_PASSWORD: nuzenio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuzenio -d nuzenio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio
      NUZENIO_TEST_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_test
      NUZENIO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: python -m nuzenio_api.seed
        working-directory: apps/api
      - run: python -m nuzenio_api.seed
        working-directory: apps/api
      - run: pytest apps/api/tests

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nuzenio
          POSTGRES_USER: nuzenio
          POSTGRES_PASSWORD: nuzenio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuzenio -d nuzenio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio:nuzenio@localhost:5432/nuzenio_e2e
      NUZENIO_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/pip install -e "apps/api[dev]"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
