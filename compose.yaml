services:
  migrate:
    build:
      context: ./apps/api
    command: ["/bin/sh", "-c", "alembic -c alembic.ini upgrade head && python -m nuzenio_api.db_roles"]
    environment:
      NUZENIO_ENVIRONMENT: development
      NUZENIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nuzenio}:${POSTGRES_PASSWORD:-nuzenio}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nuzenio}:${POSTGRES_PASSWORD:-nuzenio}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_RUNTIME_PASSWORD: ${NUZENIO_RUNTIME_PASSWORD:-local-runtime-only-password}
      NUZENIO_AUDIT_PASSWORD: ${NUZENIO_AUDIT_PASSWORD:-local-audit-only-password}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ["demo"]
    build:
      context: ./apps/api
    command: ["python", "-m", "nuzenio_api.seed"]
    environment:
      NUZENIO_ENVIRONMENT: development
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio_runtime:${NUZENIO_RUNTIME_PASSWORD:-local-runtime-only-password}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_DEMO_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    init: true
    build:
      context: ./apps/api
    environment:
      NUZENIO_ENVIRONMENT: development
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio_runtime:${NUZENIO_RUNTIME_PASSWORD:-local-runtime-only-password}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_REDIS_URL: redis://redis:6379/0
      NUZENIO_CORS_ORIGINS: '["http://localhost:3000"]'
      NUZENIO_DEMO_MODE: "true"
      NUZENIO_COOKIE_SECURE: "false"
      NUZENIO_FEED_KILL_SWITCH: "true"
      NUZENIO_ALLOWED_HOSTS: '["localhost","127.0.0.1","api","testserver"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "nuzenio_api.feed_operations"]
    environment:
      NUZENIO_ENVIRONMENT: development
      NUZENIO_DATABASE_URL: postgresql+psycopg://nuzenio_runtime:${NUZENIO_RUNTIME_PASSWORD:-local-runtime-only-password}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_REDIS_URL: redis://redis:6379/0
      NUZENIO_DEMO_MODE: "true"
      NUZENIO_WORKER_HEALTH_HOST: "0.0.0.0"
      NUZENIO_WORKER_HEALTH_PORT: "8001"
      # Fixture data uses reserved .example URLs; keep all network polling off.
      NUZENIO_FEED_KILL_SWITCH: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 20s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuzenio}
      POSTGRES_USER: ${POSTGRES_USER:-nuzenio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuzenio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuzenio} -d ${POSTGRES_DB:-nuzenio}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-restore:
    profiles: ["ci"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nuzenio_restore_verify
      POSTGRES_USER: ${POSTGRES_USER:-nuzenio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuzenio}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nuzenio} -d nuzenio_restore_verify",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  restore-verify:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: infra/postgres-tools/Dockerfile
    environment:
      NUZENIO_BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER:-nuzenio}:${POSTGRES_PASSWORD:-nuzenio}@postgres:5432/${POSTGRES_DB:-nuzenio}
      NUZENIO_RESTORE_DATABASE_URL: postgresql://${POSTGRES_USER:-nuzenio}:${POSTGRES_PASSWORD:-nuzenio}@postgres-restore:5432/nuzenio_restore_verify
      NUZENIO_RESTORE_CONFIRM_DATABASE: nuzenio_restore_verify
    volumes:
      - ./scripts:/workspace/scripts:ro
    command: ["/workspace/scripts/verify-postgres-restore.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-restore:
        condition: service_healthy

  postgres-ops-test:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: infra/postgres-tools/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuzenio}
      POSTGRES_USER: ${POSTGRES_USER:-nuzenio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuzenio}
      NUZENIO_BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER:-nuzenio}:${POSTGRES_PASSWORD:-nuzenio}@postgres:5432/${POSTGRES_DB:-nuzenio}
    volumes:
      - ./scripts:/workspace/scripts:ro
    command: ["/workspace/scripts/test-postgres-operations.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
